default:
  tags:
    - tortosa

stages:
  - sast
  - secrets
  - sbom
  - sca
  - dast-zap
  - defectdojo

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  PRODUCT_NAME: "Juice Shop"

sast:
  stage: sast
  artifacts:
    name: sast-report
    expire_in: 1 day
    paths:
      - gl-sast-report.json
    reports:
      sast: gl-sast-report.json
    
semgrep-sast:
  stage: sast
  artifacts:
    name: sast-report
    expire_in: 1 day
    paths:
      - gl-sast-report.json
    reports:
      sast: gl-sast-report.json

secret_detection:
  stage: secrets
  artifacts:
    name: secret-detection-report
    expire_in: 1 day
    paths:
      - gl-secret-detection-report.json
    reports:
      secret_detection: gl-secret-detection-report.json

generate_sbom:
  stage: sbom
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
  script:
    - syft . --scope all -o cyclonedx-json=sbom-report.json
  artifacts:
    name: sbom-report
    expire_in: 1 day
    paths:
      - sbom-report.json

sca_scan:
  stage: sca
  image: node:26-alpine
  before_script:
    - apk add --no-cache curl
    - npm install
    - cd frontend && npm install && cd ..
    - curl -sfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
  script:
    - grype . -o json --file grype-sca-report.json
  artifacts:
    name: sca-report
    expire_in: 1 day
    paths:
      - grype-sca-report.json

zap_dast_scan:
  stage: dast-zap
  image:
    name: zaproxy/zap-stable:latest
    entrypoint: [""]
  services:
    - name: bkimminich/juice-shop
      alias: juiceshop
  script:
    - echo "Waiting for Juice Shop to start..."
    - sleep 15
    - mkdir -p /zap/wrk
    - python3 /zap/zap-baseline.py -t http://juiceshop:3000 -x zap-report.xml || true
    - echo "Searching and copying the generated report..."
    - find / -name "zap-report.xml" -exec cp {} . \; 2>/dev/null || true
    - ls -la zap-report.xml || echo "Report not found"
  artifacts:
    name: dast-report
    expire_in: 1 day
    paths:
      - zap-report.xml

upload_to_defectdojo:
  stage: defectdojo
  image: python:3.11-alpine
  dependencies:
    - semgrep-sast
    - secret_detection
    - sca_scan
    - zap_dast_scan
    - generate_sbom
  before_script:
    - apk add --no-cache curl
  script:
    - |
      python3 -c "
      import os, json, urllib.request, urllib.parse, subprocess

      DD_URL = os.environ.get('DD_URL')
      API_KEY = os.environ.get('DD_API_TOKEN')
      PRODUCT_NAME = os.environ.get('PRODUCT_NAME')
      ENGAGEMENT_NAME = os.environ.get('PRODUCT_NAME')

      if not DD_URL or not API_KEY:
          print('[-] Critical error: DEFECTDOJO_URL (or DD_URL) and DEFECTDOJO_API_KEY must be configured in the GitLab CI/CD variables.')
          exit(1)

      headers = {'Authorization': f'Token {API_KEY}'}

      def api_get(endpoint):
          try:
              req = urllib.request.Request(f'{DD_URL}/api/v2/{endpoint}', headers=headers)
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read().decode())
          except Exception as e:
              return None

      print(f'[*] Looking for product: {PRODUCT_NAME}...')
      prod_res = api_get(f'products/?name={urllib.parse.quote(PRODUCT_NAME)}')
      if prod_res and prod_res.get('results'):
          product_id = prod_res['results'][0]['id']
          print(f'-> Product found with ID: {product_id}')
      else:
          print(f'-> Product not found. Searching for a valid Product Type (prod_type)...')
          
          # DefectDojo requiere un prod_type obligatorio para crear productos
          pt_res = api_get('product_types/?limit=1')
          prod_type_id = None
          if pt_res and pt_res.get('results'):
              prod_type_id = pt_res['results'][0]['id']
              print(f'-> Using Product Type ID: {prod_type_id} ({pt_res[\"results\"][0][\"name\"]})')
          else:
              # Fallback por defecto si la lista estuviera vacía
              prod_type_id = 1
              print(f'-> Not found product type, using generic one: {prod_type_id}')

          print(f'-> Creating \"{PRODUCT_NAME}\"...')
          data = json.dumps({
              'name': PRODUCT_NAME, 
              'description': 'Auto-creado por GitLab CI',
              'prod_type': prod_type_id
          }).encode()
          
          req = urllib.request.Request(f'{DD_URL}/api/v2/products/', data=data, headers={**headers, 'Content-Type': 'application/json'}, method='POST')
          try:
              with urllib.request.urlopen(req) as resp:
                  product_id = json.loads(resp.read().decode())['id']
                  print(f'-> Product created successfully with ID: {product_id}')
          except urllib.error.HTTPError as e:
              print(f'[-] HTTP Error creating product: {e.code} - {e.read().decode()}')
              exit(1)

      print(f'[*] Looking for engagement: {ENGAGEMENT_NAME}...')
      eng_res = api_get(f'engagements/?product={product_id}&name={urllib.parse.quote(ENGAGEMENT_NAME)}')
      if eng_res and eng_res.get('results'):
          engagement_id = eng_res['results'][0]['id']
          print(f'-> Engagement found with ID: {engagement_id}')
      else:
          print(f'-> Engagement not found. Creating it...')
          import datetime
          today = datetime.date.today().isoformat()
          end_date = (datetime.date.today() + datetime.timedelta(days=365)).isoformat()
          data = json.dumps({
              'product': product_id, 
              'name': ENGAGEMENT_NAME, 
              'target_start': today, 
              'target_end': end_date, 
              'status': 'In Progress'
          }).encode()
          
          req = urllib.request.Request(f'{DD_URL}/api/v2/engagements/', data=data, headers={**headers, 'Content-Type': 'application/json'}, method='POST')
          try:
              with urllib.request.urlopen(req) as resp:
                  engagement_id = json.loads(resp.read().decode())['id']
                  print(f'-> Created engagement with ID: {engagement_id}')
          except urllib.error.HTTPError as e:
              print(f'[-] Error HTTP creating engagement: {e.code} - {e.read().decode()}')
              exit(1)

      def upload_scan(filepath, scan_type, is_sbom=False):
          if not os.path.exists(filepath):
              print(f'[-] Artifact not found: {filepath}')
              return

          tests_res = api_get(f'tests/?engagement={engagement_id}&limit=100')
          existing_test_id = None
          if tests_res and tests_res.get('results'):
              for t in tests_res['results']:
                  if t.get('scan_type') == scan_type:
                      existing_test_id = t['id']
                      break

          endpoint = 'import-sbom/' if is_sbom else ('reimport-scan/' if existing_test_id else 'import-scan/')
          print(f'[*] Processing {filepath} as [{scan_type}] vía /{endpoint}...')

          curl_cmd = [
              'curl', '-s', '-X', 'POST', f'{DD_URL}/api/v2/{endpoint}',
              '-H', f'Authorization: Token {API_KEY}',
              '-F', f'engagement={engagement_id}',
              '-F', f'scan_type={scan_type}',
              '-F', f'file=@{filepath}'
          ]
          
          if not is_sbom:
              curl_cmd.extend(['-F', 'active=true', '-F', 'verified=true'])
              if existing_test_id:
                  curl_cmd.extend(['-F', f'test={existing_test_id}'])
              else:
                  curl_cmd.extend(['-F', f'product_name={PRODUCT_NAME}'])

          result = subprocess.run(curl_cmd, capture_output=True, text=True)
          print(result.stdout)

      print(f'[*] Uploading scan reports to DefectDojo...')
      upload_scan('gl-sast-report.json', 'GitLab SAST Report')
      print(f'[*] Uploading secret detection report...')
      upload_scan('gl-secret-detection-report.json', 'GitLab Secret Detection Report')
      print(f'[*] Uploading SCA scan report...')
      upload_scan('grype-sca-report.json', 'Anchore Grype')
      print(f'[*] Uploading DAST ZAP scan report...')
      upload_scan('zap-report.xml', 'ZAP Scan')
      print(f'[*] Uploading SBOM report...')
      upload_scan('sbom-report.json', 'CycloneDX Scan', is_sbom=True)
      "